apiVersion: v1
kind: Service
metadata:
  name: incident-api
  namespace: self-healing-pipeline
spec:
  selector:
    app: incident-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: self-healing-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-api
  template:
    metadata:
      labels:
        app: incident-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/self-healing-streaming-pipeline:latest
          command: ["python", "-m", "src.api.main"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
                optional: true
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: pipeline-data
              mountPath: /data
              readOnly: false
      volumes:
        - name: pipeline-data
          persistentVolumeClaim:
            claimName: pipeline-data
