apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: self-healing-pipeline
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.self-healing-pipeline.svc.cluster.local:9092
  KAFKA_RAW_TOPIC: events.raw
  KAFKA_VALIDATED_TOPIC: events.validated
  KAFKA_TRANSFORMED_TOPIC: events.transformed
  KAFKA_AGGREGATED_TOPIC: events.aggregated
  KAFKA_QUARANTINE_TOPIC: events.quarantine
  KAFKA_DEAD_LETTER_TOPIC: events.dead_letter
  KAFKA_REPLAY_TOPIC: events.replay
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TTL_SECONDS: "86400"
  SPARK_MASTER: "local[*]"
  CHECKPOINT_DIR: /data/checkpoints
  PARQUET_OUTPUT_DIR: /data/parquet
  METADATA_DIR: /data/metadata
  MAX_RETRY_ATTEMPTS: "5"
  RETRY_BASE_DELAY_SECONDS: "2"
  QUARANTINE_RATE_ALERT_THRESHOLD: "0.10"
  AI_PROVIDER: mock
  INCIDENT_API_HOST: 0.0.0.0
  INCIDENT_API_PORT: "8000"
