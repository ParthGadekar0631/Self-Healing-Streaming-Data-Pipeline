name: self-healing-streaming-pipeline

x-app: &app
  build:
    context: .
    dockerfile: deployments/docker/Dockerfile.pipeline
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    REDIS_HOST: redis
    SPARK_MASTER: spark://spark-master:7077
    CHECKPOINT_DIR: /app/data/checkpoints
    PARQUET_OUTPUT_DIR: /app/data/parquet
    METADATA_DIR: /app/data/metadata
  volumes:
    - ./data:/app/data
  networks: [pipeline-net]

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks: [pipeline-net]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [pipeline-net]

  spark-master:
    image: bitnami/spark:3.5.6
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8080:8080"
    networks: [pipeline-net]

  spark-worker:
    image: bitnami/spark:3.5.6
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    depends_on: [spark-master]
    networks: [pipeline-net]

  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_kafka_topics.sh:/scripts/create_kafka_topics.sh:ro
    command: ["bash", "/scripts/create_kafka_topics.sh", "kafka:29092"]
    networks: [pipeline-net]

  pipeline:
    <<: *app
    command:
      - spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - main.py
      - pipeline
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  incident-api:
    <<: *app
    command: ["python", "-m", "src.api.main"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  producer:
    <<: *app
    profiles: [tools]
    command: ["python", "-m", "src.producer.kafka_producer", "--count", "100", "--invalid-rate", "0.10"]
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  redis-data:

networks:
  pipeline-net:
